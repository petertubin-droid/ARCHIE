name: ARCHIE Deploy

# =============================================================
# ARCHIE lives on the FRELUX app's own Supabase project
# (Freluxtools, hqhvlkunkdrxyuvziorm) — the separate Frelukx
# project was disconnected 2026-09-13 and receives no traffic.
# The FRELUX frontend (github.com/petertubin-droid/frelux) calls
# these deployed functions through its remote bridge.
#
# This workflow keeps ARCHIE's edge functions on that project in
# sync with this repo. Runs on every push to main that touches
# ARCHIE's functions, the shared archie-ai code, or migrations —
# plus manual dispatch from the Actions tab.
#
# Database migrations are NOT deployed here: the Supabase GitHub
# integration (the "Supabase Preview" check) replays and applies
# the migration chain from this repo against the project, so this
# workflow deliberately covers only edge functions.
#
# All archie-* functions enforce their own owner/visitor
# authorization internally (JWT verified against FRELUX's public
# JWKS + profiles.role='admin'), and several have anonymous
# visitor paths — so they deploy with --no-verify-jwt. The anon
# key grants no privileges; the gateway JWT check would only
# break the visitor path.
#
# Runtime secrets (GEMINI_API_KEY, WHATSAPP_*, etc.) are managed
# in the ARCHIE project's dashboard (Edge Functions → Secrets) or
# via `supabase secrets set` — not part of deploys.
# =============================================================

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/archie-*/**'
      - 'supabase/functions/_shared/**'
      - 'supabase/migrations/**'
      - '.github/workflows/archie-deploy.yml'
  workflow_dispatch:

concurrency:
  group: archie-deploy
  cancel-in-progress: false

jobs:
  deploy-functions:
    name: Deploy archie-* edge functions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply pending database migrations (Management API)
        # DRIFT FIX (2026-10-19): this repo has NO Supabase
        # Preview integration, so migrations never auto-applied —
        # production silently drifted 14 migrations behind main
        # (found 2026-10-18). This step closes drift by
        # construction: every deploy first reconciles
        # supabase/migrations against supabase_migrations on the
        # live project (apply missing, record version), failing
        # LOUDLY on any error. Idempotent: already-recorded
        # versions are skipped.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ARCHIE_PROJECT_REF: hqhvlkunkdrxyuvziorm
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import glob, json, os, sys, urllib.request

          token = os.environ["SUPABASE_ACCESS_TOKEN"]
          ref = os.environ["ARCHIE_PROJECT_REF"]
          api = f"https://api.supabase.com/v1/projects/{ref}/database/query"

          def query(sql):
              body = json.dumps({"query": sql}).encode()
              req = urllib.request.Request(
                  api, data=body, method="POST",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req, timeout=120) as r:
                  return json.loads(r.read())

          applied = query(
              "SELECT version FROM supabase_migrations.schema_migrations"
          )
          done = {row["version"] for row in applied}

          pending = []
          for f in sorted(glob.glob("supabase/migrations/*.sql")):
              version = os.path.basename(f)[:-4].split("_")[0]
              if version not in done:
                  pending.append((version, f))

          print(f"migrations: {len(done)} recorded, {len(pending)} pending")
          for version, f in pending:
              content = open(f).read()
              result = query(content)
              if isinstance(result, dict):
                  print(f"::error::migration {version} failed: {result}")
                  sys.exit(1)
              query(
                  "INSERT INTO supabase_migrations.schema_migrations "
                  "(version, name) VALUES "
                  f"('{version}', '{version}') "
                  "ON CONFLICT (version) DO NOTHING"
              )
              print(f"applied {version}")
          print("migrations reconciled")
          PYEOF

      - name: Deploy every archie-* + ai-* function (Freluxtools only — Frelukx disconnected 2026-09-13, left intact)
        # OWNER DIRECTIVE 2026-10-18 — ARCHIE POWERS FRELUX: this
        # repo is the source of truth for the FRELUX-facing ai-*
        # functions too (extraction 2026-09-19). Deploying only
        # archie-* meant every ai-* upgrade died in the repo and
        # never reached the FRELUX frontend. All ai-* functions
        # authenticate internally (own 401 + rate limit), so they
        # deploy with --no-verify-jwt; only archie-agent-worker
        # keeps the gateway JWT lock.
        # AUDIT FIX HIGH-2 + MEDIUM-5 (2026-09-13): CI used to
        # deploy only to the mirror project while live traffic
        # hit the production project — CI-green did not mean
        # live-current. CI now deploys to BOTH, eliminating
        # drift by construction. archie-agent-worker has NO
        # anonymous visitor path (exact service-role bearer
        # equality inside), so it deploys WITH the gateway
        # JWT lock; every visitor-path function keeps
        # --no-verify-jwt as before. NOTE: the Supabase CLI has no
        # --verify-jwt flag — JWT verification is the DEFAULT, so the
        # worker deploys with no flag at all.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ARCHIE_PROJECT_REFS: hqhvlkunkdrxyuvziorm
        run: |
          set -euo pipefail
          fail=0
          deployed=0
          for ref in $ARCHIE_PROJECT_REFS; do
            for d in supabase/functions/archie-*/ supabase/functions/ai-*/; do
              name="$(basename "$d")"
              jwt_flag="--no-verify-jwt"
              if [ "$name" = "archie-agent-worker" ]; then
                jwt_flag=""  # default: JWT verification ON
              fi
              echo "::group::Deploying $name to $ref ($jwt_flag)"
              if supabase functions deploy "$name" \
                   --project-ref "$ref" \
                   $jwt_flag; then
                deployed=$((deployed + 1))
              else
                echo "::error::Failed to deploy $name to $ref"
                fail=$((fail + 1))
              fi
              echo "::endgroup::"
            done
          done
          echo "Deployed $deployed function deployment(s), $fail failure(s)."
          if [ "$fail" -gt 0 ]; then exit 1; fi

      - name: Post-deploy ai-copilot gate check (ARCHIE powers FRELUX)
        env:
          ARCHIE_PROJECT_URL: https://hqhvlkunkdrxyuvziorm.supabase.co
        run: |
          # ai-copilot deploys from this repo now. An unauthenticated
          # POST must be refused (401/429 from its own auth/rate-limit
          # gate) — proving liveness AND that self-auth survives the
          # --no-verify-jwt deployment. 000 = unreachable, 404 = not
          # deployed.
          sleep 5
          resp="$(curl -s -m 15 -w '\n%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d '{"text":"ping"}' \
            "$ARCHIE_PROJECT_URL/functions/v1/ai-copilot" || true)"
          code="$(echo "$resp" | tail -n1)"
          echo "ai-copilot HTTP $code"
          if [ "$code" = "401" ] || [ "$code" = "429" ]; then
            echo "ai-copilot live + gate verified"
          else
            echo "::error::ai-copilot health check failed: HTTP $code, body: $resp"
            exit 1
          fi

      - name: Post-deploy health check (BOTH projects)
        env:
          ARCHIE_PROJECT_URLS: https://pjvtqkshewerpvggtgqx.supabase.co https://hqhvlkunkdrxyuvziorm.supabase.co
        run: |
          # archie-status is owner-only by design (hardened in the C-1
          # batch). An unauthenticated GET must return exactly 401 with
          # the owner-gate error — proving BOTH that the deployment is
          # live AND that the owner gate is enforced. Anything else
          # fails the deploy: 000 = unreachable, 404 = not deployed,
          # 200 = GATE OFF (security regression). A health check that
          # cannot fail is decorative; this one asserts liveness + the
          # security posture in a single request.
          sleep 10
          fail=0
          for url in $ARCHIE_PROJECT_URLS; do
            resp="$(curl -s -m 15 -w '\n%{http_code}' \
              "$url/functions/v1/archie-status" || true)"
            code="$(echo "$resp" | tail -n1)"
            body="$(echo "$resp" | head -n -1)"
            echo "archie-status HTTP $code ($url)"
            if [ "$code" = "401" ] && echo "$body" | grep -q "Unauthorized"; then
              echo "owner gate verified ON"
            else
              echo "::error::archie-status health check failed ($url): HTTP $code, body: $body"
              fail=$((fail + 1))
            fi
          done
          if [ "$fail" -gt 0 ]; then exit 1; fi
