name: FRELUX DB restore (temporary)

# TEMPORARY credential host only. Runs the FRELUX repo's own consolidation
# script (all FRELUX files, ARCHIE content strictly excluded) using this
# repo's SUPABASE_ACCESS_TOKEN secret. Removed once the one-off restore
# of the FRELUX catalog from the old mirror project to the current
# project is complete.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "report | apply-migrations | copy-data"
        required: true
        default: "report"

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: petertubin-droid/frelux

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run consolidation (${{ inputs.mode }})
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/db/consolidate.mjs --mode=${{ inputs.mode }}

      - name: Write step summary
        if: always()
        run: '[ -f db-restore-summary.md ] && cat db-restore-summary.md >> "$GITHUB_STEP_SUMMARY" || true'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: db-restore-${{ inputs.mode }}-${{ github.run_id }}
          path: db-restore-report.json
          if-no-files-found: warn
